name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: build · test · clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the primary target (worker sandbox is Linux-only); macOS and
        # Windows validate that the CLI/core stay cross-platform.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      # The full suite runs on all three OSes. Tests that require unix-only
      # facilities — `bash` (CliExec exec), `/etc` protected paths, the Linux
      # seccomp worker — are gated with `#[cfg(unix)]` / `#[cfg(target_os =
      # "linux")]`, so Windows runs the portable core/CLI logic and skips those.
      - name: Test
        run: cargo test --workspace

      - name: Clippy (deny errors)
        run: cargo clippy --workspace --all-targets
