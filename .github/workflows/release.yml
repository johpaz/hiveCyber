name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            linker: gcc-aarch64-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker (aarch64 linux)
        if: matrix.linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --bin hivecyber --bin hivecyber-worker

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          DIST="hivecyber-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$DIST"
          cp "target/${{ matrix.target }}/release/hivecyber" "$DIST/"
          cp "target/${{ matrix.target }}/release/hivecyber-worker" "$DIST/"
          cp README.md LICENSE* "$DIST/" 2>/dev/null || true
          tar czf "$DIST.tar.gz" "$DIST"
          echo "ASSET=$DIST.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "hivecyber-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/hivecyber.exe" $dist
          Copy-Item "target/${{ matrix.target }}/release/hivecyber-worker.exe" $dist
          Copy-Item README.md $dist
          Compress-Archive -Path $dist -DestinationPath "$dist.zip"
          echo "ASSET=$dist.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ASSET }}

  linux-packages:
    name: linux packages · deb+rpm (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            linker: gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: pkg-${{ matrix.target }}

      - name: Install cross linker (aarch64)
        if: matrix.linker != ''
        run: |
          sudo apt-get update && sudo apt-get install -y ${{ matrix.linker }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --bin hivecyber --bin hivecyber-worker

      # nfpm builds both .deb and .rpm natively (no dpkg/rpmbuild needed) from one
      # config, with full control over the per-target binary paths.
      - name: Install nfpm
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build .deb and .rpm
        env:
          PKG_ARCH: ${{ matrix.arch }}
          BIN_DIR: target/${{ matrix.target }}/release
        run: |
          sudo apt-get update && sudo apt-get install -y gettext-base
          export PKG_VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # Render ${VAR} placeholders (nfpm doesn't expand env vars in `src`).
          envsubst < packaging/nfpm.yaml > nfpm.rendered.yaml
          nfpm package --config nfpm.rendered.yaml --packager deb --target dist/
          nfpm package --config nfpm.rendered.yaml --packager rpm --target dist/
          ls -la dist/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*

  musl:
    name: musl static (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: musl-${{ matrix.target }}

      # `cross` runs the build in a Docker image that ships the musl toolchain
      # (incl. the C compiler `ring`/rustls needs) — reliable for x86_64 and
      # aarch64 static binaries that run on ANY glibc/musl distro (Alpine too).
      - name: Install cross
        run: cargo install cross --locked

      - name: Build static binaries
        run: cross build --release --target ${{ matrix.target }} --bin hivecyber --bin hivecyber-worker

      - name: Package
        shell: bash
        run: |
          DIST="hivecyber-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$DIST"
          cp "target/${{ matrix.target }}/release/hivecyber" "$DIST/"
          cp "target/${{ matrix.target }}/release/hivecyber-worker" "$DIST/"
          cp README.md "$DIST/"
          tar czf "$DIST.tar.gz" "$DIST"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: hivecyber-*-${{ matrix.target }}.tar.gz

  docker:
    name: docker image (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hivecyber:${{ github.ref_name }} .
